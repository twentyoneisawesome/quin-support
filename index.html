<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quin — Support</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Redirect to the best-matching language folder based on the browser locale.
    (function () {
      var supported = ['en', 'zh-tw', 'zh-cn', 'ja', 'ko'];
      var langs = (navigator.languages && navigator.languages.length)
        ? navigator.languages
        : [navigator.language || 'en'];
      for (var i = 0; i < langs.length; i++) {
        var l = (langs[i] || '').toLowerCase();
        if (l === 'zh-tw' || l === 'zh-hant' || l === 'zh-hk' || l === 'zh-mo') return go('zh-tw');
        if (l === 'zh-cn' || l === 'zh-hans' || l === 'zh-sg' || l === 'zh') return go('zh-cn');
        if (l.indexOf('ja') === 0) return go('ja');
        if (l.indexOf('ko') === 0) return go('ko');
        if (l.indexOf('en') === 0) return go('en');
      }
      function go(code) { location.replace(code + '/'); }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="logo" src="assets/icon.png" alt="Quin app icon">
      <h1>Quin Support</h1>
      <p class="tagline">Choose your language / 選擇語言 / 选择语言 / 言語を選択 / 언어 선택</p>
    </header>
    <nav class="langbar">
      <a href="en/">English</a>
      <a href="zh-tw/">繁體中文</a>
      <a href="zh-cn/">简体中文</a>
      <a href="ja/">日本語</a>
      <a href="ko/">한국어</a>
    </nav>
    <footer>
      <p>© 2026 Quin</p>
    </footer>
  </div>
</body>
</html>
